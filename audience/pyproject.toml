[project]
name = "audience"
version = "0.1.0"
description = "PAX audience database: population, attitude and prior-test norms."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=15",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.1",
  "pytz",  # DuckDB needs it to return timestamptz values
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audience*"]

[tool.setuptools.package-data]
audience = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
