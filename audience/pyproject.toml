[project]
name = "audience"
version = "0.1.0"
description = "PAX audience database: population, attitude and prior-test norms."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=15",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.1",
  "pytz",  # DuckDB needs it to return timestamptz values
  "pandas>=2.2",      # survey loaders: weighted cells
  "pyreadstat>=1.2",  # GSS, ANES, WVS Stata/SPSS files, read by column
  "curl_cffi>=0.7",   # ANES download (electionstudies.org refuses plain HTTP clients)
  "pyreadr>=0.5",     # the lift dataset's .RDS files
  "pdfplumber>=0.11",  # MA enrollment breakdowns (PDF), read by word position
  "fastapi>=0.110",   # audience/server.py, the read-only JSON router
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI TestClient

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audience*"]

[tool.setuptools.package-data]
audience = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
